<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Tết - Thì Hiện Tại Đơn - Lớp 3</title>
    <link rel="stylesheet" href="MCQstyle.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="quiz-container">
        <h1>🧧 Bài Tập 🧧</h1>
        <h2 style="font-size: 18px; color: #d32f2f; border: none; font-weight: bold; text-align: center;">Chuyên Đề: Thì hiện tại đơn (Simple Present)</h2>
        <p style="text-align: center; font-style: italic;">Lưu ý: Chủ ngữ số ít thì chia động từ, số nhiều không chia động từ</p>

        <div style="text-align: center; margin-bottom: 20px;">
            <input type="text" id="studentName" placeholder="Nhập tên của bạn..." 
                   style="padding: 12px; border: 2px solid #d32f2f; border-radius: 20px; width: 70%; text-align: center; font-size: 16px; outline: none;">
        </div>

        <form id="quizForm"></form>

        <button id="submitBtn" type="button" onclick="submitQuiz()">Nộp Bài Nhận Lì Xì 🧧</button>

        <div id="result" style="display: none;"></div>

        <div class="history-section">
            <h2>📜 Lịch sử luyện tập</h2>
            <div id="history-list">Đang tải...</div>
        </div>

        <div id="historyModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h2 style="color: #d32f2f; text-align: center;">Chi Tiết Bài Làm 🧧</h2>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>
    <script src="MCQscript.js"></script>
</body>
</html>
